<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JOLLY'S ADVENTURE</title><style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Fredoka'}
body{background:#FF9A00;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#top{background:linear-gradient(90deg,#FF0066,#FF3D00);padding:8px 12px;display:flex;justify-content:space-between;color:white}
canvas{width:100%;flex:1;display:block}
#ui{position:absolute;bottom:12px;left:0;width:100%;display:flex;justify-content:space-between;padding:0 12px}
#ui button{padding:16px 26px;border-radius:16px;border:3px solid #000;font-size:18px;font-weight:800;box-shadow:3px 3px 0 #000}
#jumpB{background:#00FF88}#retryB{background:#FFCC00}
#playB{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#FFEA00;padding:20px 40px;font-size:24px;border-radius:20px;border:4px solid #000;box-shadow:5px 5px 0 #000;z-index:10}
#msg{position:absolute;top:28%;width:100%;text-align:center;color:white;font-size:26px;text-shadow:3px 3px 0 #000;z-index:9}
</style></head><body>
<div id="top"><b>🌈 JOLLY'S ADVENTURE 🌟</b><span>💰<b id="coin">0</b> ⭐<b id="sc">0</b> 🏆<b id="best">0</b></span></div>
<div style="position:relative;flex:1"><canvas id="c"></canvas>
<div id="msg">🏃‍♂️ JOLLY RUN!<br><small style="font-size:16px">You are the hero! Tap JUMP!</small></div>
<button id="playB" onclick="start()">▶️ PLAY AS JOLLY</button>
<div id="ui"><button id="jumpB" onclick="jump()">⬆️ JUMP</button><button id="retryB" onclick="start()">🔄 RETRY</button></div></div>
<script>
let cv=document.getElementById('c'),ctx=cv.getContext('2d'),W,H,pl,obs,coins,clouds,sc,coinCnt,best,play=false,fr=0,spd=4;
best=localStorage.jb||0; document.getElementById('best').innerText=best;
function size(){W=cv.width=innerWidth; H=cv.height=innerHeight-40} size(); onresize=size;
class Player{constructor(){this.x=70;this.y=H-120;this.vy=0;this.g=H-110;this.on=true}
upd(){this.vy+=0.85;this.y+=this.vy; if(this.y>=this.g){this.y=this.g;this.vy=0;this.on=true}}
jmp(){if(this.on){this.vy=-17;this.on=false}}
draw(){ // DRAW JOLLY - white shirt, brown pants, glasses, bag
let x=this.x,y=this.y;
ctx.fillStyle='#6D4C2A'; ctx.fillRect(x+6,y+30,18,28); ctx.fillRect(x+30,y+30,18,28); // pants
ctx.fillStyle='#000'; ctx.fillRect(x+4,y+58,22,8); ctx.fillRect(x+28,y+58,22,8); // shoes
ctx.fillStyle='white'; ctx.fillRect(x,y,54,32); ctx.fillStyle='#000'; ctx.fillRect(x+18,y+8,3,3); ctx.fillRect(x+18,y+18,3,3); // shirt buttons
ctx.fillStyle='#FFD6A0'; ctx.fillRect(x+12,y-18,30,20); // face
ctx.fillStyle='black'; ctx.fillRect(x+10,y-14,28,8); ctx.fillRect(x+12,y-12,10,4); ctx.fillRect(x+22,y-12,10,4); // shades
ctx.fillStyle='#2A2A2A'; ctx.fillRect(x+34,y+2,14,16); ctx.fillRect(x+32,y+0,20,3); // bag
if(!this.on){y-=5} ctx.fillText('😃',x+15,y-16)
}}
function start(){size();pl=new Player();obs=[];coins=[];clouds=[];sc=0;coinCnt=0;fr=0;spd=4;play=true;
for(let i=0;i<4;i++)clouds.push({x:Math.random()*W,y:Math.random()*120});
document.getElementById('playB').style.display='none';document.getElementById('msg').style.display='none';loop()}
function jump(){if(pl)pl.jmp()}
function loop(){if(!play)return;fr++;ctx.clearRect(0,0,W,H);
let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#87CEEB');g.addColorStop(1,'#FFE082');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.font='32px Arial';clouds.forEach(c=>{c.x-=0.6;if(c.x<-40)c.x=W+40;ctx.fillText('☁️',c.x,c.y)});
ctx.fillStyle='#2ECC71';ctx.fillRect(0,H-50,W,50);
if(fr%115==0){if(Math.random()<0.7)obs.push({x:W,y:H-50-36,w:36,h:36,t:Math.random()>0.5?'👹':'🌵'});else coins.push({x:W,y:H-120-Math.random()*70,w:26,h:26})}
if(fr%320==0)spd+=0.15;
pl.upd(); pl.draw();
ctx.font='36px Arial';
for(let i=obs.length-1;i>=0;i--){let o=obs[i];o.x-=spd;ctx.fillText(o.t,o.x,o.y+30);if(o.x<pl.x+36&&o.x+30>pl.x+6&&o.y<pl.y+60&&o.y+30>pl.y+5&&fr>70){play=false;over()}if(o.x<-60)obs.splice(i,1)}
for(let i=coins.length-1;i>=0;i--){let c=coins[i];c.x-=spd;ctx.fillText('💰',c.x,c.y+20);if(c.x<pl.x+40&&c.x+20>pl.x&&c.y<pl.y+60&&c.y+20>pl.y){coinCnt++;document.getElementById('coin').innerText=coinCnt;coins.splice(i,1)}if(c.x<-60)coins.splice(i,1)}
sc+=0.18;document.getElementById('sc').innerText=Math.floor(sc);requestAnimationFrame(loop)}
function over(){let m=document.getElementById('msg');m.style.display='block';m.innerHTML=`💀 JOLLY CAUGHT!<br>Score ${Math.floor(sc)}<br>Coins ${coinCnt}`;document.getElementById('playB').style.display='block';document.getElementById('playB').innerText='🔄 PLAY AGAIN';if(Math.floor(sc)>best){best=Math.floor(sc);localStorage.jb=best;document.getElementById('best').innerText=best}}
cv.addEventListener('touchstart',e=>{e.preventDefault();jump()});addEventListener('keydown',e=>{if(e.code=='Space')jump()});
</script></body></html>
